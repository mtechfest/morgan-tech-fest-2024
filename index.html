<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <!-- Jotform AI registration agent: loaded after the page is idle so the
       widget never competes with first paint, and skipped on tiny/slow devices
       where a chat overlay is the first thing to bog down. -->
  <script>
    (function () {
      var c = navigator.connection || {};
      if (c.saveData || /2g/.test(c.effectiveType || '') || (navigator.deviceMemory && navigator.deviceMemory < 2)) return;
      function load() {
        var s = document.createElement('script');
        s.src = 'https://cdn.jotfor.ms/agent/embedjs/019f7ded9cc07000806ac4ac33d37c79238f/embed.js';
        s.async = true;
        document.body.appendChild(s);
      }
      function schedule() {
        if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 8000 });
        else setTimeout(load, 4000);
      }
      if (document.readyState === 'complete') schedule();
      else window.addEventListener('load', schedule, { once: true });
    })();
  </script>
</body>
